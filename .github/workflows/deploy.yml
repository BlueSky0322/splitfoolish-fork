name: Build and Deploy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Neither job writes to GitHub: deploying uses the Cloudflare secrets alone
permissions:
  contents: read

# Actions are pinned to a commit, so a moved tag can't change what runs with the
# Cloudflare token. Update them deliberately.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn vitest run
      # yarn build is tsc -p web then vite build; yarn typecheck above has done the tsc
      - run: yarn vite build web

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      # A restore point from just before any migration, kept in this run's log (a bookmark,
      # no data): `wrangler d1 time-travel restore splitfoolish-db --bookmark=<it>`
      - name: Note the database's restore point
        run: npx wrangler d1 time-travel info splitfoolish-db

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply splitfoolish-db --remote

      - name: Deploy
        run: npx wrangler deploy
